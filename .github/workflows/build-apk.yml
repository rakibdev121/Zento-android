name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack the app project
        run: unzip -q Zento-android.zip -d project

      - name: Build the APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Name the APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk Zento.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zento-APK
          path: Zento.apk

      - name: Publish a download link
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Zento app (latest)
          body: Download Zento.apk on your Android phone and install it.
          files: Zento.apk
          make_latest: true
